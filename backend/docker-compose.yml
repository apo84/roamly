version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: roamly-postgres
    environment:
      POSTGRES_USER: roamly
      POSTGRES_PASSWORD: roamly
      POSTGRES_DB: roamly_dev
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roamly"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:

