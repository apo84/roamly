version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: trove-postgres
    environment:
      POSTGRES_USER: trove
      POSTGRES_PASSWORD: trove
      POSTGRES_DB: trove_dev
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trove"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:

